{% extends 'base.html' %}

{% block title %}Reports | AI Cybersecurity Threat Detection Platform{% endblock %}

{% block content %}

<div class="reports-page">

    <div class="row justify-content-center">

        <div class="col-12 col-xl-10">

            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">

                <div>

                    <h1 class="display-6 fw-bold mb-1">
                        Reports
                    </h1>

                    <p class="text-muted mb-0">
                        Review all uploaded CSV analysis reports.
                    </p>

                </div>

                <a href="/dashboard" class="btn btn-outline-primary">

                    <i class="bi bi-arrow-left me-2"></i>

                    Back to Dashboard

                </a>

            </div>

            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-body p-4 p-lg-5">

                    <div class="table-responsive">

                        <table class="table align-middle reports-table mb-0">

                            <thead>

                                <tr>

                                    <th>Report Name</th>

                                    <th>Generated Date</th>

                                    <th>Status</th>

                                    <th>View Report</th>

                                </tr>

                            </thead>

                            <tbody id="reportsTable">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

async function loadReports(){

    try{

        const response = await fetch("/reports-data");

        const reports = await response.json();

        let html = "";

        if(reports.length===0){

            html=`

            <tr>

                <td colspan="4" class="text-center text-muted">

                    No reports available.

                </td>

            </tr>

            `;

        }

        else{

            reports.forEach(report=>{

                html+=`

                <tr>

                    <td>

                        ${report.filename}

                    </td>

                    <td>

                        ${report.date}

                    </td>

                    <td>

                        <span class="badge bg-success">

                            ${report.status}

                        </span>

                    </td>

                    <td>

                        <a href="/view-report/${report._id}"

                           class="btn btn-sm btn-primary">

                            <i class="bi bi-eye"></i>

                            View Report

                        </a>

                    </td>

                </tr>

                `;

            });

        }

        document.getElementById("reportsTable").innerHTML=html;

    }

    catch(error){

        console.log(error);

    }

}

window.onload=loadReports;

</script>

{% endblock %}
