{% extends 'base.html' %}

{% block title %}Login | AI Cybersecurity Threat Detection Platform{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="row justify-content-center align-items-center min-vh-100 py-5">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
            <div class="auth-card card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="auth-icon mx-auto mb-3">
                            <i class="bi bi-shield-lock-fill"></i>
                        </div>
                        <h1 class="h3 fw-bold mb-2">Welcome back</h1>
                        <p class="text-muted mb-0">Sign in to continue monitoring threats and analyzing traffic.</p>
                    </div>

                    <form method="POST" action="/login" class="auth-form">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <div class="input-group input-group-lg auth-input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group input-group-lg auth-input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe" name="remember_me">
                                <label class="form-check-label" for="rememberMe">Remember Me</label>
                            </div>
                            <a href="/register" class="text-decoration-none fw-medium">Create an account</a>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold auth-submit-btn">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Login
                        </button>
                    </form>
                </div>
            </div>

            <div class="text-center mt-4">
                <p class="text-muted mb-0">New here? <a href="/register" class="fw-semibold text-decoration-none">Register now</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
