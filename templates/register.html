{% extends 'base.html' %}

{% block title %}Register | AI Cybersecurity Threat Detection Platform{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="row justify-content-center align-items-center min-vh-100 py-5">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
            <div class="auth-card card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="auth-icon mx-auto mb-3">
                            <i class="bi bi-person-plus-fill"></i>
                        </div>
                        <h1 class="h3 fw-bold mb-2">Create your account</h1>
                        <p class="text-muted mb-0">Register to access monitoring, analysis, and reporting tools.</p>
                    </div>

                    <form method="POST" action="/register" class="auth-form">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <div class="input-group input-group-lg auth-input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <div class="input-group input-group-lg auth-input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group input-group-lg auth-input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirm_password" class="form-label">Confirm Password</label>
                            <div class="input-group input-group-lg auth-input-group">
                                <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold auth-submit-btn">
                            <i class="bi bi-person-check me-2"></i>Register
                        </button>
                    </form>
                </div>
            </div>

            <div class="text-center mt-4">
                <p class="text-muted mb-0">Already have an account? <a href="/login" class="fw-semibold text-decoration-none">Back to login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
